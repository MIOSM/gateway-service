server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    eureka:
      client:
        service-url:
          defaultZone: http://eureka-server:8761/eureka
        register-with-eureka: true
        fetch-registry: true
      instance:
        prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    MIOSM.gateway_service: DEBUG